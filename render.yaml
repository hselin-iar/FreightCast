# Render 100% Free-Tier Infrastructure Blueprint (No Credit Card Required)
# Reference: DOC3 §4 & DOC4 Step 14

services:
  # ─── 1. FastAPI Web API Service (100% Free, Zero Card Required) ─────────────
  - type: web
    name: freightcast-api
    runtime: python
    rootDir: freight-system
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: FRONTEND_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: AISSTREAM_API_KEY
        sync: false
      - key: MYSHIPTRACKING_API_KEY
        sync: false
      - key: OILPRICEAPI_API_KEY
        sync: false
